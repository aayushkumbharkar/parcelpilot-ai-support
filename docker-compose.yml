services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8010:8000"
    environment:
      - MOCK_MODE=true
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174
    volumes:
      - ./data:/app/data

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8010
    depends_on:
      - backend
